# ReXGlue runtime settings, read from <exe dir>/el_chavo_kart.toml.
# The launcher writes the player's choices to <user data>/settings.toml, which is loaded after this file.
gpu_plugin = "xenos"

# Keyboard emulates the Xbox 360 pad next to a connected controller.
mnk_mode = true
# Empty skips the optional gamecontrollerdb.txt load; SDL's built-in mappings still apply.
hid_mappings_file = ""

# Default game window: 1280x720 logical, centered on the primary display. Logical pixels are scaled by the display scale.
fullscreen = false
monitor = 1
window_width = 1280
window_height = 720
# The game renders 1280x720 (its SystemSettings ResX/ResY); independent of the window size.
video_mode_width = 1280
video_mode_height = 720

# VSync On by default: swaps are held to eck_frame_rate (60 by default), and tearing stays opt-in in the launcher.
d3d12_allow_variable_refresh_rate_and_tearing = false

# A deeper host audio queue, as in Marvel Ultimate Alliance and Geometry Wars 2, against underruns while streaming.
audio_maxqframes = 16

# Kart keyboard layout; the launcher's Controls page edits these.
keybind_right_trigger = "W"
keybind_left_trigger = "S"
keybind_lstick_left = "A,Left"
keybind_lstick_right = "D,Right"
keybind_lstick_up = "Up"
keybind_lstick_down = "Down"
keybind_a = "Space"
keybind_b = "E,Backspace"
keybind_x = "Q"
keybind_y = "C"
keybind_left_shoulder = "Z"
keybind_right_shoulder = "R"
keybind_back = "Tab"
keybind_start = "Return,P"
keybind_dpad_up = "Shift+Up"
keybind_dpad_down = "Shift+Down"
keybind_dpad_left = "Shift+Left"
keybind_dpad_right = "Shift+Right"
keybind_rstick_up = "I"
keybind_rstick_down = "K"
keybind_rstick_left = "J"
keybind_rstick_right = "L"
keybind_lstick_press = "V"
keybind_rstick_press = "M"
